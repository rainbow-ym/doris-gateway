<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>集群管理 · 数据安全网关</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18283e;font:15px system-ui}header{background:#14263f;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px}main{max-width:1200px;margin:36px auto;padding:0 24px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:24px}.muted{color:#64748b;line-height:1.7}button,input{font:inherit;padding:10px 14px;border-radius:7px;border:1px solid #cbd5e1}button{cursor:pointer;background:white}button.primary{background:#2563eb;color:white;border-color:#2563eb}dialog{border:0;border-radius:14px;width:min(580px,95vw);padding:28px}dialog::backdrop{background:#0f172a88}label{display:block;margin:14px 0}input{display:block;width:100%;margin-top:6px}.error{color:#b91c1c;white-space:pre-wrap}a{color:#2563eb}.actions{display:flex;gap:12px;justify-content:flex-end}</style>
<header><h1>数据安全网关 · 集群管理</h1><div><span id="user"></span>　<button onclick="document.getElementById('passwordDialog').showModal()">修改密码</button> <button onclick="logout()">退出登录</button></div></header>
<main><div class="bar"><div><h2>我的集群</h2><p class="muted">各集群使用独立管理数据库和网关实例；相同用户名、库表名不会混用。</p></div><button class="primary" onclick="document.getElementById('register').showModal()">登记集群实例</button></div><p id="error" class="error"></p><div id="clusters" class="grid"></div><p class="muted">版本 2026.10.15-clusters.1 · 初始化、批量用户导入、外部表同步和策略配置均在具体集群内执行。</p></main>
<dialog id="register"><form id="clusterForm"><h2>登记集群实例</h2><p class="muted">先部署该集群的独立网关及管理实例，再登记到平台。本功能不会远程控制 Docker，也不会复用其他集群的凭据。</p><label>集群名称<input name="name" maxlength="128" required></label><label>管理实例地址<input name="workerUrl" placeholder="http://127.0.0.1:18082" required></label><label>管理实例账号<input name="workerUsername" required autocomplete="off"></label><label>管理实例密码<input name="workerPassword" type="password" required autocomplete="new-password"></label><label>业务网关地址<input name="gatewayAddress" placeholder="192.168.232.132:3308" required></label><p class="error" id="registerError"></p><div class="actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">验证并登记</button></div></form></dialog>
<dialog id="passwordDialog"><form id="passwordForm"><h2>修改管理员密码</h2><label>当前密码<input name="oldPassword" type="password" required autocomplete="current-password"></label><label>新密码（至少 12 个字符）<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><p id="passwordError" class="error"></p><div class="actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">修改并重新登录</button></div></form></dialog>
<script>
let session,clusterRows=[],editingId=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json',[session.csrfHeader]:session.csrf},body:body?JSON.stringify(body):undefined});if(r.status===401){location.replace('/login.html');throw Error('请重新登录')}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'操作失败，请检查服务。');return j}
async function load(){const rows=clusterRows=await call('/api/clusters');document.getElementById('clusters').innerHTML=rows.length?rows.map(c=>'<article class="card"><h3>'+esc(c.name)+'</h3><p class="muted">网关 '+esc(c.gatewayAddress)+'</p><a href="/console/index.html?cluster='+encodeURIComponent(c.id)+'">进入集群管理 →</a><p><button data-edit="'+c.id+'">编辑</button> <button data-remove="'+c.id+'">解除登记</button></p></article>').join(''):'<div class="card">尚未登记集群。请先部署独立实例，再点击“登记集群实例”。</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=clusterRows.find(x=>x.id===b.dataset.edit),f=document.getElementById('clusterForm');editingId=c.id;for(const k of ['name','workerUrl','workerUsername','gatewayAddress'])f.elements[k].value=c[k];f.elements.workerPassword.required=false;f.elements.workerPassword.placeholder='留空保留当前密码';document.getElementById('register').showModal()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>unregisterCluster(b.dataset.remove).catch(e=>document.getElementById('error').textContent=e.message))}
async function unregisterCluster(id){const c=clusterRows.find(x=>x.id===id);const d=document.createElement('dialog');d.innerHTML='<h2>解除集群登记</h2><p>确认解除 '+esc(c.name)+' 的平台登记？不会删除独立网关、Doris 数据或集群策略。</p><div class="actions"><button data-cancel>取消</button><button data-confirm>确认解除</button></div>';document.body.append(d);d.querySelector('[data-cancel]').onclick=()=>{d.close();d.remove()};d.querySelector('[data-confirm]').onclick=async e=>{e.target.disabled=true;try{await call('/api/clusters/'+id,'DELETE');d.close();d.remove();await load()}catch(x){document.getElementById('error').textContent=x.message;e.target.disabled=false}};d.showModal()}
document.getElementById('register').addEventListener('close',()=>{editingId=null;document.getElementById('clusterForm').reset();document.getElementById('clusterForm').elements.workerPassword.required=true;document.getElementById('registerError').textContent=''});
async function logout(){await call('/logout','POST');location.replace('/login.html')}
document.getElementById('clusterForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await call('/api/clusters'+(editingId?'/'+editingId:''),editingId?'PUT':'POST',Object.fromEntries(new FormData(e.target)));e.target.reset();document.getElementById('register').close();await load()}catch(x){document.getElementById('registerError').textContent=x.message}finally{b.disabled=false}};
document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await call('/api/admin/password','POST',Object.fromEntries(new FormData(e.target)));location.replace('/login.html')}catch(x){document.getElementById('passwordError').textContent=x.message}finally{b.disabled=false}};
(async()=>{session=await(await fetch('/api/session',{cache:'no-store'})).json();if(!session.authenticated){location.replace('/login.html');return}document.getElementById('user').textContent=session.username;await load()})().catch(e=>document.getElementById('error').textContent=e.message);
</script></html>
