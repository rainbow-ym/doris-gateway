<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 数据安全网关</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#172337;font:16px system-ui}main{width:min(420px,92vw);padding:36px;background:white;border:1px solid #dde4ee;border-radius:18px;box-shadow:0 20px 70px #142d5010}h1{font-size:25px}p{color:#64748b;line-height:1.7}label{display:block;margin-top:20px}input,button{width:100%;padding:13px;border-radius:8px;border:1px solid #cbd5e1;font:inherit;margin-top:8px}button{background:#2563eb;color:white;border:0;cursor:pointer;margin-top:26px}#message{color:#b91c1c;min-height:24px}small{color:#64748b}</style>
<main><h1>数据安全网关</h1><p>管理员登录后，可管理已登记的 Doris 集群。数据库业务账号不能用于登录本平台。</p><form id="form"><label>管理员账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button id="submit">登录</button></form><p id="message" role="alert"></p><small>会话空闲 30 分钟后过期。请通过可信管理网络访问。</small></main>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;m.textContent='';try{const s=await(await fetch('/api/session',{cache:'no-store'})).json();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',[s.csrfHeader]:s.csrf},body:new URLSearchParams(new FormData(e.target))});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.message||'登录失败，请刷新后重试。')}location.replace('/')}catch(x){m.textContent=x.message}finally{b.disabled=false}};</script></html>
